<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考官编排管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #3498db;
            flex-shrink: 0;
        }
        
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .description {
            color: #7f8c8d;
            font-size: 14px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .main-container {
            display: flex;
            flex: 1;
            max-width: 1800px;
            margin: 0 auto;
            gap: 20px;
            width: 100%;
            overflow: hidden;
        }
        
        /* 左侧已编排考官面板 */
        .assigned-panel {
            width: 280px;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .assigned-panel-header {
            flex-shrink: 0;
        }
        
        .assigned-panel-title {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ecf0f1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .control-section {
            margin-bottom: 20px;
        }
        
        .control-label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 600;
            font-size: 14px;
        }
        
        select, input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        
        .assigned-examiner-list-container {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
        }
        
        .assigned-examiner-item {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }
        
        .assigned-examiner-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .assigned-examiner-details {
            font-size: 12px;
            color: #7f8c8d;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        /* 中央编排区域 */
        .arrangement-area {
            flex: 1;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .arrangement-header {
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        
        .control-buttons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .btn-small {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .btn-small:hover {
            background-color: #2980b9;
            transform: translateY(-1px);
        }
        
        .btn-import {
            background-color: #2ecc71;
        }
        
        .btn-import:hover {
            background-color: #27ae60;
        }
        
        .btn-export {
            background-color: #9b59b6;
        }
        
        .btn-export:hover {
            background-color: #8e44ad;
        }
        
        .btn-clear {
            background-color: #e74c3c;
        }
        
        .btn-clear:hover {
            background-color: #c0392b;
        }
        
        .btn-preview {
            background-color: #f39c12;
        }
        
        .btn-preview:hover {
            background-color: #d68910;
        }
        
        .btn-restore {
            background-color: #1abc9c;
        }
        
        .btn-restore:hover {
            background-color: #16a085;
        }
        
        .auto-save-status {
            font-size: 12px;
            color: #7f8c8d;
            margin-left: 10px;
            display: flex;
            align-items: center;
        }
        
        .auto-save-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #2ecc71;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }
        
        .auto-save-dot.inactive {
            background-color: #e74c3c;
            animation: none;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .file-input-hidden {
            display: none;
        }
        
        .arrangement-table-container {
            flex: 1;
            overflow: auto;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        
        .table-fixed-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #2c3e50;
        }
        
        .exam-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }
        
        .exam-table th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
            text-align: center;
            padding: 12px 8px;
            border-right: 1px solid #3a506b;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .exam-table th:first-child {
            border-top-left-radius: 8px;
        }
        
        .exam-table th:last-child {
            border-top-right-radius: 8px;
            border-right: none;
        }
        
        .exam-table td {
            padding: 10px 8px;
            border: 1px solid #e0e0e0;
            text-align: center;
            min-height: 60px;
            vertical-align: middle;
        }
        
        /* 表格列宽定义 */
        .col-room {
            width: 80px;
            background-color: #f8f9fa;
            font-weight: 600;
        }
        
        .col-count {
            width: 150px;
            background-color: #f8f9fa;
        }
        
        .col-teacher {
            width: 140px;
        }
        
        .col-subject {
            width: 120px;
        }
        
        /* 拖拽区域样式 */
        .teacher-drop-zone {
            min-height: 60px;
            border: 2px dashed #ddd;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            padding: 8px;
        }
        
        .teacher-drop-zone:hover {
            border-color: #3498db;
            background-color: #f0f8ff;
        }
        
        .teacher-drop-zone.filled {
            border-style: solid;
            border-color: #d5e8f4;
            background-color: #f0f8ff;
            color: #333;
            cursor: move;
        }
        
        .teacher-info {
            width: 100%;
        }
        
        .teacher-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
            margin-bottom: 4px;
        }
        
        .teacher-school {
            font-size: 12px;
            color: #3498db;
            font-weight: 600;
            display: inline-block;
            padding: 2px 8px;
            background-color: #e8f4fc;
            border-radius: 10px;
        }
        
        /* 右侧考官信息面板 */
        .examiner-panel {
            width: 300px;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .panel-header {
            flex-shrink: 0;
        }
        
        .panel-title {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ecf0f1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .search-box {
            position: relative;
        }
        
        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #7f8c8d;
        }
        
        /* 考官列表样式 */
        .examiner-list-container {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
        }
        
        .examiner-item {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: move;
            transition: all 0.2s;
        }
        
        .examiner-item:hover {
            background-color: #e3f2fd;
            border-color: #bbdefb;
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        }
        
        .examiner-item.dragging {
            opacity: 0.5;
            transform: scale(1.02);
        }
        
        .examiner-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .examiner-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }
        
        .examiner-subject-badge {
            display: inline-block;
            background-color: #e8f4fc;
            color: #3498db;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .examiner-details {
            font-size: 12px;
            color: #7f8c8d;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        /* 已编排考官筛选 */
        .assigned-filter {
            display: flex;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ecf0f1;
        }
        
        .filter-label {
            font-size: 14px;
            color: #34495e;
            margin-right: 10px;
        }
        
        .filter-checkbox {
            width: auto;
            margin-right: 5px;
        }
        
        /* 状态信息 */
        .status-info {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ecf0f1;
            font-size: 14px;
            color: #7f8c8d;
        }
        
        /* 拖拽相关样式 */
        .drop-zone-hover {
            border-color: #3498db !important;
            background-color: #e3f2fd !important;
        }
        
        .row-drop-zone-hover {
            background-color: #e3f2fd !important;
        }
        
        /* 无数据提示 */
        .no-data-msg {
            text-align: center;
            color: #7f8c8d;
            padding: 40px 20px;
            font-size: 16px;
        }
        
        .no-data-msg .icon {
            font-size: 48px;
            margin-bottom: 15px;
            color: #bdc3c7;
        }
        
        /* 预览模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            max-width: 90%;
            max-height: 90%;
            overflow: auto;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ecf0f1;
        }
        
        .modal-title {
            font-size: 18px;
            color: #2c3e50;
            font-weight: 600;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #7f8c8d;
        }
        
        /* 响应式设计 */
        @media (max-width: 1400px) {
            .main-container {
                flex-direction: column;
                height: auto;
            }
            
            .assigned-panel, .examiner-panel {
                width: 100%;
                max-height: 400px;
            }
        }
        
        @media (max-width: 768px) {
            .control-buttons-container {
                flex-direction: column;
            }
            
            .btn-group {
                width: 100%;
            }
            
            .btn-small {
                flex: 1;
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>考官编排管理系统</h1>
        <p class="description">导入考官信息和学科人数数据，通过拖拽方式编排考官到8列表格中</p>
    </header>
    
    <div class="main-container">
        <!-- 左侧已编排考官面板 -->
        <div class="assigned-panel">
            <div class="assigned-panel-header">
                <div class="assigned-panel-title">
                    <span>已编排考官</span>
                </div>
                
                <div class="control-section">
                    <label class="control-label">按县区筛选</label>
                    <select id="area-filter">
                        <option value="all">全部县区</option>
                        <!-- 县区选项将在导入数据后动态生成 -->
                    </select>
                </div>
                
                <div class="control-section">
                    <label class="control-label">按工作单位筛选</label>
                    <select id="school-filter">
                        <option value="all">全部单位</option>
                        <!-- 工作单位选项将在导入数据后动态生成 -->
                    </select>
                </div>
            </div>
            
            <div class="assigned-examiner-list-container">
                <div class="assigned-examiner-list" id="assigned-examiner-list">
                    <!-- 已编排考官列表将通过JavaScript动态生成 -->
                    <div class="no-data-msg">
                        <div class="icon">👤</div>
                        <div>暂无已编排考官</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 中央编排区域 -->
        <div class="arrangement-area">
            <div class="arrangement-header">
                <div class="control-buttons-container">
                    <div class="btn-group">
                        <button id="import-examiners" class="btn-small btn-import">导入考官数据</button>
                        <button id="import-subject-counts" class="btn-small btn-import">导入学科人数</button>
                        <button id="preview-export" class="btn-small btn-preview">导出前预览</button>
                        <button id="backup-data" class="btn-small">备份数据</button>
                        <button id="restore-data" class="btn-small btn-restore">还原备份</button>
                        <button id="clear-all" class="btn-small btn-clear">清空所有编排</button>
                    </div>
                    
                    <div class="btn-group">
                        <button id="export-csv" class="btn-small btn-export">导出编排表 (CSV)</button>
                        <button id="export-xlsx" class="btn-small btn-export">导出编排表 (XLSX)</button>
                        <button id="export-txt" class="btn-small btn-export">导出编排表 (TXT)</button>
                    </div>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div class="exam-room-control" style="display: flex; align-items: center; gap: 10px;">
                        <label style="font-weight: 600;">考场数量：</label>
                        <input type="number" id="room-count" style="width: 80px; padding: 8px;" min="1" max="100" value="68">
                        <button id="update-rooms" class="btn-small">更新考场</button>
                    </div>
                    
                    <div class="auto-save-status" id="auto-save-status">
                        <span class="auto-save-dot inactive" id="auto-save-dot"></span>
                        <span id="auto-save-text">自动保存已禁用</span>
                    </div>
                </div>
            </div>
            
            <div class="arrangement-table-container">
                <table class="exam-table" id="exam-table">
                    <thead class="table-fixed-header">
                        <tr>
                            <th class="col-room">考场号</th>
                            <th class="col-count">学科人数</th>
                            <th class="col-teacher">教师姓名1</th>
                            <th class="col-subject">学科1</th>
                            <th class="col-teacher">教师姓名2</th>
                            <th class="col-subject">学科2</th>
                            <th class="col-teacher">教师姓名3</th>
                            <th class="col-subject">学科3</th>
                        </tr>
                    </thead>
                    <tbody id="exam-table-body">
                        <!-- 表格行将通过JavaScript动态生成 -->
                        <tr>
                            <td colspan="8" class="no-data-msg">
                                <div class="icon">📁</div>
                                <div>请先导入考官信息和学科人数数据</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- 右侧考官信息面板 -->
        <div class="examiner-panel">
            <div class="panel-header">
                <div class="panel-title">
                    <span>考官信息库</span>
                    <span id="examiner-count">0 位</span>
                </div>
                
                <div class="control-section">
                    <label class="control-label">按学科筛选</label>
                    <select id="subject-filter">
                        <option value="all">全部学科</option>
                        <!-- 学科选项将在导入数据后动态生成 -->
                    </select>
                </div>
                
                <div class="control-section">
                    <label class="control-label">搜索考官姓名</label>
                    <div class="search-box">
                        <input type="text" id="name-search" placeholder="输入考官姓名...">
                        <span class="search-icon">🔍</span>
                    </div>
                </div>
                
                <div class="assigned-filter">
                    <label class="filter-label">
                        <input type="checkbox" id="hide-assigned" class="filter-checkbox">
                        隐藏已编排考官
                    </label>
                </div>
                
                <div class="status-info">
                    <span id="unassigned-count">未分配: 0</span>
                    <span id="assigned-count">已分配: 0</span>
                </div>
            </div>
            
            <div class="examiner-list-container">
                <div class="examiner-list" id="examiner-list">
                    <!-- 考官列表将通过JavaScript动态生成 -->
                    <div class="no-data-msg">
                        <div class="icon">👤</div>
                        <div>请导入考官数据</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 隐藏的文件输入元素 -->
    <input type="file" id="file-input-examiners" class="file-input-hidden" accept=".txt">
    <input type="file" id="file-input-subject-counts" class="file-input-hidden" accept=".txt">
    <input type="file" id="file-input-restore" class="file-input-hidden" accept=".json">

    <!-- 预览模态框 -->
    <div id="preview-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">导出预览</h3>
                <button class="modal-close" id="close-preview">×</button>
            </div>
            <div id="preview-content">
                <!-- 预览内容将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <script>
        // 考官数据存储
        let examiners = [];
        let assignedExaminers = new Set(); // 存储已被分配的考官ID
        let examRooms = [];
        let currentRoomCount = 68; // 默认68个考场，与学科人数.txt文件一致
        let nextExaminerId = 1;
        let subjectCounts = {}; // 存储学科人数信息
        let autoSaveTimer = null; // 自动保存计时器
        let autoSaveEnabled = false; // 自动保存是否启用（默认禁用）
        let isDataModified = false; // 数据是否被修改
        let lastBackupData = null; // 存储上次备份数据，用于还原
        
        // DOM元素
        const fileInputExaminers = document.getElementById('file-input-examiners');
        const fileInputSubjectCounts = document.getElementById('file-input-subject-counts');
        const fileInputRestore = document.getElementById('file-input-restore');
        const importExaminersBtn = document.getElementById('import-examiners');
        const importSubjectCountsBtn = document.getElementById('import-subject-counts');
        const backupDataBtn = document.getElementById('backup-data');
        const restoreDataBtn = document.getElementById('restore-data');
        const exportCsvBtn = document.getElementById('export-csv');
        const exportXlsxBtn = document.getElementById('export-xlsx');
        const exportTxtBtn = document.getElementById('export-txt');
        const previewExportBtn = document.getElementById('preview-export');
        const clearAllBtn = document.getElementById('clear-all');
        const roomCountInput = document.getElementById('room-count');
        const updateRoomsBtn = document.getElementById('update-rooms');
        const subjectFilter = document.getElementById('subject-filter');
        const nameSearch = document.getElementById('name-search');
        const hideAssignedCheckbox = document.getElementById('hide-assigned');
        const areaFilter = document.getElementById('area-filter');
        const schoolFilter = document.getElementById('school-filter');
        const examinerList = document.getElementById('examiner-list');
        const assignedExaminerList = document.getElementById('assigned-examiner-list');
        const examinerCount = document.getElementById('examiner-count');
        const unassignedCount = document.getElementById('unassigned-count');
        const assignedCount = document.getElementById('assigned-count');
        const examTableBody = document.getElementById('exam-table-body');
        const previewModal = document.getElementById('preview-modal');
        const closePreviewBtn = document.getElementById('close-preview');
        const previewContent = document.getElementById('preview-content');
        const autoSaveStatus = document.getElementById('auto-save-status');
        const autoSaveDot = document.getElementById('auto-save-dot');
        const autoSaveText = document.getElementById('auto-save-text');
        
        // 解析考官.txt文件内容
        function parseExaminerFile(content) {
            const lines = content.split('\n');
            const newExaminers = [];
            
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;
                
                // 支持制表符和空格分隔
                const parts = line.split(/\t| {2,}/);
                if (parts.length >= 6) {
                    const examiner = {
                        id: nextExaminerId++,
                        name: parts[0] || "",
                        school: parts[1] || "",
                        subject: parts[2] || "",
                        phone: parts[3] || "",
                        period: parts[4] || "",
                        gender: parts[5] || "",
                        assigned: false,
                        area: extractAreaFromSchool(parts[1] || "") // 提取县区信息
                    };
                    newExaminers.push(examiner);
                }
            });
            
            return newExaminers;
        }
        
        // 从工作单位提取县区信息
        function extractAreaFromSchool(school) {
            if (!school) return "未知";
            
            // 常见的县区关键词
            const areaKeywords = [
                "景德镇市", "珠山区", "昌江区", "浮梁县", "乐平市", 
                "市直", "市属", "市直属", "市实验", "市第一", "市第二", "市第三"
            ];
            
            for (const keyword of areaKeywords) {
                if (school.includes(keyword)) {
                    return keyword.replace("市", "").replace("县", "").replace("区", "");
                }
            }
            
            return "其他";
        }
        
        // 检查工作单位是否属于景德镇
        function isJingdezhenSchool(school) {
            if (!school) return false;
            
            // 判断是否包含"景德镇"（不要求包含"市"）
            return school.includes("景德镇");
        }
        
        // 解析学科人数.txt文件内容（根据文档1格式）
        function parseSubjectCountsFile(content) {
            const lines = content.split('\n');
            const counts = {};
            
            lines.forEach((line, index) => {
                line = line.trim();
                if (!line) return;
                
                const roomNumber = index + 1;
                const parts = line.split('\t').filter(part => part.trim() !== '');
                
                // 解析格式：学科人数 如 "52幼"、"27小音 12初音 15高音"
                let roomCounts = [];
                parts.forEach(part => {
                    // 跳过纯数字（考场号）
                    if (/^\d+$/.test(part.trim())) return;
                    
                    // 解析学科人数格式
                    const countMatch = part.match(/(\d+)(.+)/);
                    if (countMatch) {
                        const count = parseInt(countMatch[1]);
                        const subject = countMatch[2].trim();
                        roomCounts.push(`${subject}: ${count}人`);
                    }
                });
                
                counts[roomNumber] = roomCounts.join('<br>');
            });
            
            return counts;
        }

        // 拖拽考官开始
        function dragExaminerStart(event) {
            const target = event.target.classList.contains('teacher-drop-zone') ? 
                         event.target : event.target.closest('.teacher-drop-zone, .examiner-item');
            
            if (!target) return;
            
            const examinerId = target.getAttribute('data-id') || 
                              target.getAttribute('data-examiner-id');
            
            if (examinerId) {
                event.dataTransfer.setData('examinerId', examinerId);
                event.dataTransfer.setData('dragType', 'examiner');
                
                // 如果是来自表格的拖拽，记录位置信息
                if (target.classList.contains('teacher-drop-zone')) {
                    const roomId = target.getAttribute('data-room-id');
                    const slotIndex = target.getAttribute('data-slot-index');
                    event.dataTransfer.setData('sourceRoomId', roomId);
                    event.dataTransfer.setData('sourceSlotIndex', slotIndex);
                }
                
                // 添加拖拽效果
                target.classList.add('dragging');
            }
        }
        
        // 拖拽考场行开始
        function dragRoomStart(event) {
            const target = event.target;
            
            if (!target.classList.contains('col-room') && !target.classList.contains('col-count')) {
                return;
            }
            
            const row = target.closest('tr');
            if (row) {
                const roomId = row.getAttribute('data-room-id');
                if (roomId) {
                    event.dataTransfer.setData('roomId', roomId);
                    event.dataTransfer.setData('dragType', 'room');
                    
                    // 添加拖拽效果
                    row.style.opacity = '0.5';
                }
            }
        }
        
        // 允许放置考官
        function allowDrop(event) {
            event.preventDefault();
            
            // 添加悬停效果
            const dropZone = event.target.classList.contains('teacher-drop-zone') ? 
                           event.target : event.target.closest('.teacher-drop-zone');
            
            if (dropZone) {
                dropZone.classList.add('drop-zone-hover');
            }
        }
        
        // 允许放置行
        function allowRowDrop(event) {
            event.preventDefault();
            
            const dragType = event.dataTransfer.getData('dragType');
            if (dragType === 'room') {
                const targetRow = event.target.closest('tr');
                if (targetRow) {
                    targetRow.classList.add('row-drop-zone-hover');
                }
            }
        }
        
        // 移除悬停效果
        function removeHoverEffects() {
            // 移除所有悬停样式
            const hoverElements = document.querySelectorAll('.drop-zone-hover');
            hoverElements.forEach(el => el.classList.remove('drop-zone-hover'));
            
            const rowHoverElements = document.querySelectorAll('.row-drop-zone-hover');
            rowHoverElements.forEach(el => el.classList.remove('row-drop-zone-hover'));
        }
        
        // 放置考官
        function dropExaminer(event) {
            event.preventDefault();
            removeHoverEffects();
            
            const dropZone = event.target.classList.contains('teacher-drop-zone') ? 
                           event.target : event.target.closest('.teacher-drop-zone');
            
            if (!dropZone) return;
            
            const examinerId = parseInt(event.dataTransfer.getData('examinerId'));
            const dragType = event.dataTransfer.getData('dragType');
            
            if (dragType !== 'examiner' || !examinerId) return;
            
            const targetRoomId = parseInt(dropZone.getAttribute('data-room-id'));
            const targetSlotIndex = parseInt(dropZone.getAttribute('data-slot-index'));
            
            if (!targetRoomId || isNaN(targetSlotIndex)) return;
            
            const examiner = getExaminerById(examinerId);
            if (!examiner) return;
            
            const targetRoom = examRooms.find(r => r.id === targetRoomId);
            if (!targetRoom) return;
            
            // 获取源位置信息
            const sourceRoomId = parseInt(event.dataTransfer.getData('sourceRoomId'));
            const sourceSlotIndex = parseInt(event.dataTransfer.getData('sourceSlotIndex'));
            
            // 如果是从考官列表拖拽过来的
            if (isNaN(sourceRoomId) || isNaN(sourceSlotIndex)) {
                // 检查考官是否已经被分配
                let sourceRoomIdFound = null;
                let sourceSlotIndexFound = null;
                
                examRooms.forEach((room, roomIndex) => {
                    const slotIndex = room.examiners.indexOf(examinerId);
                    if (slotIndex !== -1) {
                        sourceRoomIdFound = room.id;
                        sourceSlotIndexFound = slotIndex;
                    }
                });
                
                // 如果考官已被分配，先移除原位置
                if (sourceRoomIdFound !== null && sourceSlotIndexFound !== null) {
                    const sourceRoom = examRooms.find(r => r.id === sourceRoomIdFound);
                    if (sourceRoom) {
                        sourceRoom.examiners[sourceSlotIndexFound] = null;
                    }
                }
                
                // 将考官分配到目标位置
                targetRoom.examiners[targetSlotIndex] = examinerId;
                examiner.assigned = true;
                
                // 更新UI
                updateExamTable();
                updateExaminerList();
                updateAssignedExaminerList();
            } 
            // 如果是从表格内拖拽（调换位置）
            else {
                const sourceRoom = examRooms.find(r => r.id === sourceRoomId);
                
                if (sourceRoom && sourceRoom.examiners[sourceSlotIndex] === examinerId) {
                    // 获取目标位置的考官ID（如果有）
                    const targetExaminerId = targetRoom.examiners[targetSlotIndex];
                    
                    // 交换两个位置的考官
                    sourceRoom.examiners[sourceSlotIndex] = targetExaminerId;
                    targetRoom.examiners[targetSlotIndex] = examinerId;
                    
                    // 如果目标位置原来有考官，需要更新其assigned状态
                    if (targetExaminerId) {
                        const targetExaminer = getExaminerById(targetExaminerId);
                        if (targetExaminer) {
                            targetExaminer.assigned = true;
                        }
                    }
                    
                    // 更新UI
                    updateExamTable();
                    updateExaminerList();
                    updateAssignedExaminerList();
                }
            }
            
            // 移除拖拽元素的样式
            const draggingElements = document.querySelectorAll('.dragging');
            draggingElements.forEach(el => el.classList.remove('dragging'));
            
            // 移除行拖拽效果
            const rows = document.querySelectorAll('#exam-table-body tr');
            rows.forEach(row => row.style.opacity = '');
        }
        
        // 放置行（考场调换）
        function dropRow(event) {
            event.preventDefault();
            removeHoverEffects();
            
            const targetRow = event.target.closest('tr');
            if (!targetRow) {
                // 移除行拖拽效果
                const rows = document.querySelectorAll('#exam-table-body tr');
                rows.forEach(row => row.style.opacity = '');
                return;
            }
            
            const dragType = event.dataTransfer.getData('dragType');
            if (dragType !== 'room') {
                // 移除行拖拽效果
                const rows = document.querySelectorAll('#exam-table-body tr');
                rows.forEach(row => row.style.opacity = '');
                return;
            }
            
            const sourceRoomId = parseInt(event.dataTransfer.getData('roomId'));
            const targetRoomId = parseInt(targetRow.getAttribute('data-room-id'));
            
            if (!sourceRoomId || !targetRoomId || sourceRoomId === targetRoomId) {
                // 移除行拖拽效果
                const rows = document.querySelectorAll('#exam-table-body tr');
                rows.forEach(row => row.style.opacity = '');
                return;
            }
            
            // 交换考场数据
            const sourceRoomIndex = examRooms.findIndex(r => r.id === sourceRoomId);
            const targetRoomIndex = examRooms.findIndex(r => r.id === targetRoomId);
            
            if (sourceRoomIndex !== -1 && targetRoomIndex !== -1) {
                // 1. 交换考场在数组中的位置
                [examRooms[sourceRoomIndex], examRooms[targetRoomIndex]] = [examRooms[targetRoomIndex], examRooms[sourceRoomIndex]];
                
                // 2. 交换学科人数信息
                const tempSubjectCounts = subjectCounts[sourceRoomId];
                subjectCounts[sourceRoomId] = subjectCounts[targetRoomId];
                subjectCounts[targetRoomId] = tempSubjectCounts;
                
                // 3. 交换考场号
                const tempId = examRooms[sourceRoomIndex].id;
                examRooms[sourceRoomIndex].id = examRooms[targetRoomIndex].id;
                examRooms[targetRoomIndex].id = tempId;
                
                // 重新生成表格
                rebuildExamTable();
                
                // 标记数据已被修改
                markDataModified();
            }
            
            // 移除行拖拽效果
            const rows = document.querySelectorAll('#exam-table-body tr');
            rows.forEach(row => row.style.opacity = '');
        }
        
        // 重新生成表格（保持考场顺序）
        function rebuildExamTable() {
            // 按考场号排序
            examRooms.sort((a, b) => a.id - b.id);
            
            // 清空表格
            examTableBody.innerHTML = '';
            
            // 重新创建表格行
            examRooms.forEach(room => {
                // 创建表格行
                const row = document.createElement('tr');
                row.setAttribute('data-room-id', room.id);
                row.setAttribute('ondragover', 'allowRowDrop(event)');
                row.setAttribute('ondrop', 'dropRow(event)');
                
                // 考场号
                const roomCell = document.createElement('td');
                roomCell.className = 'col-room';
                roomCell.textContent = room.id;
                roomCell.setAttribute('draggable', 'true');
                roomCell.setAttribute('ondragstart', 'dragRoomStart(event)');
                row.appendChild(roomCell);
                
                // 学科人数（从subjectCounts获取）
                const countCell = document.createElement('td');
                countCell.className = 'col-count';
                countCell.innerHTML = subjectCounts[room.id] || '-';
                countCell.setAttribute('draggable', 'true');
                countCell.setAttribute('ondragstart', 'dragRoomStart(event)');
                row.appendChild(countCell);
                
                // 3组教师和学科单元格
                for (let j = 0; j < 3; j++) {
                    // 教师姓名单元格（第三、五、七列）
                    const teacherCell = document.createElement('td');
                    teacherCell.className = 'col-teacher';
                    
                    const teacherDropZone = document.createElement('div');
                    teacherDropZone.className = 'teacher-drop-zone empty';
                    teacherDropZone.setAttribute('ondrop', 'dropExaminer(event)');
                    teacherDropZone.setAttribute('ondragover', 'allowDrop(event)');
                    teacherDropZone.setAttribute('data-room-id', room.id);
                    teacherDropZone.setAttribute('data-slot-index', j);
                    teacherDropZone.textContent = '拖拽考官到此';
                    
                    teacherCell.appendChild(teacherDropZone);
                    row.appendChild(teacherCell);
                    
                    // 学科单元格（第四、六、八列）
                    const subjectCell = document.createElement('td');
                    subjectCell.className = 'col-subject';
                    subjectCell.textContent = '-';
                    subjectCell.setAttribute('data-room-id', room.id);
                    subjectCell.setAttribute('data-slot-index', j);
                    row.appendChild(subjectCell);
                }
                
                examTableBody.appendChild(row);
            });
            
            // 更新表格内容
            updateExamTable();
        }
        
        // 清空所有编排
        function clearAllAssignments() {
            if (!confirm('确定要清空所有考场的编排吗？此操作不可撤销。')) {
                return;
            }
            
            examRooms.forEach(room => {
                room.examiners = room.examiners.map(() => null);
            });
            
            examiners.forEach(examiner => {
                examiner.assigned = false;
            });
            
            assignedExaminers.clear();
            
            // 更新UI
            updateExamTable();
            updateExaminerList();
            updateAssignedExaminerList();
        }
        
        // 备份数据
        function backupData() {
            const data = {
                examiners: examiners,
                examRooms: examRooms,
                subjectCounts: subjectCounts,
                backupTime: new Date().toLocaleString('zh-CN')
            };
            
            // 保存备份数据用于还原
            lastBackupData = data;
            
            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            
            const downloadLink = document.createElement('a');
            downloadLink.href = URL.createObjectURL(dataBlob);
            downloadLink.download = `考官编排备份_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            
            alert('数据备份成功！备份数据已保存，可使用"还原备份"功能恢复。');
        }
        
        // 还原备份数据
        function restoreBackupData() {
            if (!lastBackupData) {
                if (confirm('没有找到备份数据，是否从文件还原？')) {
                    fileInputRestore.click();
                }
                return;
            }
            
            if (confirm('确定要还原备份数据吗？当前未保存的修改将会丢失。')) {
                restoreDataFromObject(lastBackupData);
                alert('备份数据还原成功！');
            }
        }
        
        // 从文件还原备份数据
        function restoreBackupFromFile(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = JSON.parse(event.target.result);
                    restoreDataFromObject(data);
                    lastBackupData = data;
                    alert('备份文件还原成功！');
                } catch (error) {
                    alert('还原失败：文件格式不正确');
                }
            };
            
            reader.readAsText(file, 'UTF-8');
        }
        
        // 从数据对象还原
        function restoreDataFromObject(data) {
            examiners = data.examiners || [];
            examRooms = data.examRooms || [];
            subjectCounts = data.subjectCounts || {};
            
            // 更新下一个考官ID
            if (examiners.length > 0) {
                nextExaminerId = Math.max(...examiners.map(e => e.id)) + 1;
            }
            
            // 更新筛选器
            updateSubjectFilter();
            updateAreaFilter();
            updateSchoolFilter();
            
            // 更新UI
            updateExaminerList();
            updateAssignedExaminerList();
            
            // 重建表格
            if (examRooms.length > 0) {
                currentRoomCount = examRooms.length;
                roomCountInput.value = currentRoomCount;
                rebuildExamTable();
            } else {
                initExamTable(currentRoomCount);
            }
            
            // 重置修改状态
            isDataModified = false;
        }
        
        // 标记数据被修改
        function markDataModified() {
            isDataModified = true;
            
            if (autoSaveEnabled) {
                autoSaveDot.classList.remove('inactive');
                autoSaveText.textContent = '数据已修改，自动保存中...';
                
                // 清除之前的定时器
                if (autoSaveTimer) {
                    clearTimeout(autoSaveTimer);
                }
                
                // 设置自动保存
                autoSaveTimer = setTimeout(() => {
                    if (isDataModified) {
                        saveToLocalStorage();
                        isDataModified = false;
                        autoSaveText.textContent = '已自动保存';
                        setTimeout(() => {
                            autoSaveText.textContent = '自动保存已启用';
                        }, 2000);
                    }
                }, 5000); // 5秒后自动保存
            }
        }
        
        // 保存到本地存储
        function saveToLocalStorage() {
            if (!autoSaveEnabled) return;
            
            try {
                const data = {
                    examiners: examiners,
                    examRooms: examRooms,
                    subjectCounts: subjectCounts,
                    saveTime: new Date().toISOString()
                };
                
                localStorage.setItem('examinerArrangementData', JSON.stringify(data));
                console.log('数据已自动保存到本地存储');
            } catch (error) {
                console.error('自动保存失败:', error);
            }
        }
        
        // 从本地存储加载
        function loadFromLocalStorage() {
            try {
                const savedData = localStorage.getItem('examinerArrangementData');
                if (savedData) {
                    const data = JSON.parse(savedData);
                    
                    examiners = data.examiners || [];
                    examRooms = data.examRooms || [];
                    subjectCounts = data.subjectCounts || {};
                    
                    // 更新下一个考官ID
                    if (examiners.length > 0) {
                        nextExaminerId = Math.max(...examiners.map(e => e.id)) + 1;
                    }
                    
                    // 更新筛选器
                    updateSubjectFilter();
                    updateAreaFilter();
                    updateSchoolFilter();
                    
                    // 更新UI
                    updateExaminerList();
                    updateAssignedExaminerList();
                    
                    // 重建表格
                    if (examRooms.length > 0) {
                        currentRoomCount = examRooms.length;
                        roomCountInput.value = currentRoomCount;
                        rebuildExamTable();
                    } else {
                        initExamTable(currentRoomCount);
                    }
                    
                    console.log('已从本地存储恢复数据');
                    return true;
                }
            } catch (error) {
                console.error('从本地存储加载数据失败:', error);
            }
            return false;
        }
        
        // 显示导出预览
        function showExportPreview(format) {
            if (examiners.length === 0) {
                alert('请先导入考官数据！');
                return;
            }
            
            let previewHtml = `<h4>预览格式：${format}</h4>`;
            previewHtml += `<div style="overflow: auto; max-height: 400px;">`;
            previewHtml += `<table style="width: 100%; border-collapse: collapse; font-size: 12px;">`;
            previewHtml += `<thead><tr style="background-color: #f2f2f2;">`;
            previewHtml += `<th style="border: 1px solid #ddd; padding: 5px;">考场号</th>`;
            previewHtml += `<th style="border: 1px solid #ddd; padding: 5px;">学科人数</th>`;
            previewHtml += `<th style="border: 1px solid #ddd; padding: 5px;">教师姓名1</th>`;
            previewHtml += `<th style="border: 1px solid #ddd; padding: 5px;">学科1</th>`;
            previewHtml += `<th style="border: 1px solid #ddd; padding: 5px;">教师姓名2</th>`;
            previewHtml += `<th style="border: 1px solid #ddd; padding: 5px;">学科2</th>`;
            previewHtml += `<th style="border: 1px solid #ddd; padding: 5px;">教师姓名3</th>`;
            previewHtml += `<th style="border: 1px solid #ddd; padding: 5px;">学科3</th>`;
            previewHtml += `</tr></thead><tbody>`;
            
            examRooms.forEach(room => {
                previewHtml += `<tr>`;
                previewHtml += `<td style="border: 1px solid #ddd; padding: 5px;">${room.id}</td>`;
                previewHtml += `<td style="border: 1px solid #ddd; padding: 5px;">${subjectCounts[room.id] ? subjectCounts[room.id].replace(/<br>/g, ' ') : '-'}</td>`;
                
                for (let i = 0; i < 3; i++) {
                    const examinerId = room.examiners[i];
                    if (examinerId) {
                        const examiner = getExaminerById(examinerId);
                        previewHtml += `<td style="border: 1px solid #ddd; padding: 5px;">${examiner ? examiner.name : '-'}</td>`;
                        previewHtml += `<td style="border: 1px solid #ddd; padding: 5px;">${examiner ? examiner.subject : '-'}</td>`;
                    } else {
                        previewHtml += `<td style="border: 1px solid #ddd; padding: 5px;">-</td>`;
                        previewHtml += `<td style="border: 1px solid #ddd; padding: 5px;">-</td>`;
                    }
                }
                
                previewHtml += `</tr>`;
            });
            
            previewHtml += `</tbody></table></div>`;
            previewHtml += `<div style="margin-top: 15px; color: #666; font-size: 12px;">`;
            previewHtml += `<p>共 ${examRooms.length} 个考场，${examiners.filter(e => e.assigned).length} 位考官已编排</p>`;
            previewHtml += `</div>`;
            
            previewContent.innerHTML = previewHtml;
            previewModal.style.display = 'flex';
        }
        
        // 导出为CSV格式
        function exportToCSV() {
            if (examiners.length === 0) {
                alert('请先导入考官数据！');
                return;
            }
            
            // 创建CSV内容
            let csvContent = "考场号,学科人数,教师姓名1,学科1,教师姓名2,学科2,教师姓名3,学科3\n";
            
            examRooms.forEach(room => {
                const row = [];
                row.push(room.id); // 考场号
                row.push(subjectCounts[room.id] ? subjectCounts[room.id].replace(/<br>/g, ' ') : '-'); // 学科人数
                
                // 添加3组教师姓名和学科
                for (let i = 0; i < 3; i++) {
                    const examinerId = room.examiners[i];
                    if (examinerId) {
                        const examiner = getExaminerById(examinerId);
                        // 教师姓名列：只包含姓名
                        row.push(examiner ? `"${examiner.name}"` : '-');
                        // 学科列：显示学科
                        row.push(examiner ? `"${examiner.subject}"` : '-');
                    } else {
                        row.push('-');
                        row.push('-');
                    }
                }
                
                csvContent += row.join(',') + '\n';
            });
            
            // 创建并下载文件
            const blob = new Blob(['\ufeff' + csvContent], { 
                type: 'text/csv;charset=utf-8' 
            });
            
            const downloadLink = document.createElement('a');
            downloadLink.href = URL.createObjectURL(blob);
            downloadLink.download = `考官编排表_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            
            alert('考官编排表导出成功！保存为CSV格式，可用Excel直接打开。');
        }
        
        // 导出为XLSX格式
        function exportToXLSX() {
            exportToCSV(); // 暂时使用CSV格式，可以后续集成SheetJS库
            alert('XLSX格式导出功能需要集成SheetJS库，当前使用CSV格式替代。');
        }
        
        // 导出为TXT格式
        function exportToTXT() {
            if (examiners.length === 0) {
                alert('请先导入考官数据！');
                return;
            }
            
            // 创建TXT内容
            let txtContent = "考场号\t学科人数\t教师姓名1\t学科1\t教师姓名2\t学科2\t教师姓名3\t学科3\n";
            
            examRooms.forEach(room => {
                const row = [];
                row.push(room.id); // 考场号
                row.push(subjectCounts[room.id] ? subjectCounts[room.id].replace(/<br>/g, ' ') : '-'); // 学科人数
                
                // 添加3组教师姓名和学科
                for (let i = 0; i < 3; i++) {
                    const examinerId = room.examiners[i];
                    if (examinerId) {
                        const examiner = getExaminerById(examinerId);
                        // 教师姓名列：只包含姓名
                        row.push(examiner ? examiner.name : '-');
                        // 学科列：显示学科
                        row.push(examiner ? examiner.subject : '-');
                    } else {
                        row.push('-');
                        row.push('-');
                    }
                }
                
                txtContent += row.join('\t') + '\n';
            });
            
            // 创建并下载文件
            const blob = new Blob(['\ufeff' + txtContent], { 
                type: 'text/plain;charset=utf-8' 
            });
            
            const downloadLink = document.createElement('a');
            downloadLink.href = URL.createObjectURL(blob);
            downloadLink.download = `考官编排表_${new Date().toISOString().split('T')[0]}.txt`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            
            alert('考官编排表导出成功！保存为TXT格式。');
        }
        
        // 处理考官文件导入
        function handleExaminerFileImport(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const content = event.target.result;
                const newExaminers = parseExaminerFile(content);
                
                if (newExaminers.length > 0) {
                    examiners = newExaminers;
                    nextExaminerId = examiners.length + 1;
                    assignedExaminers.clear();
                    
                    // 清空现有编排
                    examRooms.forEach(room => {
                        room.examiners = room.examiners.map(() => null);
                    });
                    
                    // 更新筛选器
                    updateSubjectFilter();
                    updateAreaFilter();
                    updateSchoolFilter();
                    
                    // 更新UI
                    updateExaminerList();
                    updateAssignedExaminerList();
                    updateExamTable();
                    
                    alert(`成功导入 ${examiners.length} 位考官信息！`);
                } else {
                    alert('未能解析考官文件，请确保文件格式正确（姓名、工作单位、学科、联系电话、培训期数、性别，以制表符或空格分隔）。');
                }
            };
            
            reader.readAsText(file, 'UTF-8');
        }
        
        // 处理学科人数文件导入
        function handleSubjectCountsFileImport(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const content = event.target.result;
                const counts = parseSubjectCountsFile(content);
                
                if (Object.keys(counts).length > 0) {
                    subjectCounts = counts;
                    
                    // 获取最大考场号
                    const maxRoomNumber = Math.max(...Object.keys(counts).map(Number));
                    
                    // 如果当前考场数量小于文件中的最大考场号，提示更新
                    if (currentRoomCount < maxRoomNumber) {
                        if (confirm(`学科人数文件包含 ${maxRoomNumber} 个考场，是否将考场数量更新为 ${maxRoomNumber}？`)) {
                            roomCountInput.value = maxRoomNumber;
                            initExamTable(maxRoomNumber);
                        }
                    }
                    
                    // 更新表格中的学科人数
                    updateExamTable();
                    
                    alert(`成功导入 ${Object.keys(counts).length} 个考场的学科人数信息！`);
                } else {
                    alert('未能解析学科人数文件，请确保文件格式正确（如文档中的格式）。');
                }
            };
            
            reader.readAsText(file, 'UTF-8');
        }
        
        // 事件监听器
        importExaminersBtn.addEventListener('click', function() {
            fileInputExaminers.click();
        });
        
        importSubjectCountsBtn.addEventListener('click', function() {
            fileInputSubjectCounts.click();
        });
        
        fileInputExaminers.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            handleExaminerFileImport(file);
            fileInputExaminers.value = '';
        });
        
        fileInputSubjectCounts.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            handleSubjectCountsFileImport(file);
            fileInputSubjectCounts.value = '';
        });
        
        fileInputRestore.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            restoreBackupFromFile(file);
            fileInputRestore.value = '';
        });
        
        backupDataBtn.addEventListener('click', backupData);
        restoreDataBtn.addEventListener('click', restoreBackupData);
        exportCsvBtn.addEventListener('click', exportToCSV);
        exportXlsxBtn.addEventListener('click', exportToXLSX);
        exportTxtBtn.addEventListener('click', exportToTXT);
        previewExportBtn.addEventListener('click', function() {
            showExportPreview('CSV');
        });
        clearAllBtn.addEventListener('click', clearAllAssignments);
        closePreviewBtn.addEventListener('click', function() {
            previewModal.style.display = 'none';
        });
        
        // 点击模态框外部关闭
        previewModal.addEventListener('click', function(e) {
            if (e.target === previewModal) {
                previewModal.style.display = 'none';
            }
        });
        
        // 更新考场数量
        updateRoomsBtn.addEventListener('click', function() {
            const count = parseInt(roomCountInput.value) || 68;
            if (count < 1 || count > 100) {
                alert('考场数量必须在1-100之间');
                return;
            }
            
            initExamTable(count);
        });
        
        // 筛选和搜索事件
        subjectFilter.addEventListener('change', updateExaminerList);
        nameSearch.addEventListener('input', updateExaminerList);
        hideAssignedCheckbox.addEventListener('change', updateExaminerList);
        areaFilter.addEventListener('change', updateAssignedExaminerList);
        schoolFilter.addEventListener('change', updateAssignedExaminerList);
        
        // 拖拽相关事件处理
        document.addEventListener('dragover', function(event) {
            if (event.target.classList.contains('teacher-drop-zone') || 
                event.target.closest('.teacher-drop-zone')) {
                allowDrop(event);
            }
            
            if (event.target.closest('tr')) {
                allowRowDrop(event);
            }
        });
        
        document.addEventListener('dragleave', function(event) {
            removeHoverEffects();
        });
        
        document.addEventListener('dragend', function(event) {
            removeHoverEffects();
            
            // 移除所有拖拽样式
            const draggingElements = document.querySelectorAll('.dragging');
            draggingElements.forEach(el => el.classList.remove('dragging'));
            
            // 移除行拖拽效果
            const rows = document.querySelectorAll('#exam-table-body tr');
            rows.forEach(row => {
                row.style.opacity = '';
            });
        });
        
        // 自动保存状态切换
        autoSaveStatus.addEventListener('click', function() {
            autoSaveEnabled = !autoSaveEnabled;
            if (autoSaveEnabled) {
                autoSaveDot.classList.remove('inactive');
                autoSaveText.textContent = '自动保存已启用';
            } else {
                autoSaveDot.classList.add('inactive');
                autoSaveText.textContent = '自动保存已禁用';
            }
        });
        
               // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始时没有数据
            examiners = [];
            examRooms = [];
            subjectCounts = {};
            
            // 尝试从本地存储加载数据
            const loaded = loadFromLocalStorage();
            
            if (!loaded) {
                // 初始化表格（默认68个考场，与学科人数.txt一致）
                roomCountInput.value = currentRoomCount;
                initExamTable(currentRoomCount);
                
                // 初始状态
                updateExaminerList();
                updateAssignedExaminerList();
            }
            
            // 设置自动保存状态（默认禁用）
            autoSaveDot.classList.add('inactive');
            autoSaveText.textContent = '自动保存已禁用';
        });
        
        // 页面关闭前提示保存
        window.addEventListener('beforeunload', function(e) {
            if (isDataModified) {
                saveToLocalStorage();
            }
        });
    </script>
</body>
</html>
